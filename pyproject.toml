[project]
name = "html5-named-entity-decoder"
version = "0.1.0"
description = "Decodes the complete set of HTML5 named character references, including legacy entities without trailing semicolons."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
